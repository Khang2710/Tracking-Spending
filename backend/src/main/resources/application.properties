# ===================================================================
# Spring Boot Configuration for PostgreSQL Database (Cloud & Local)
# ===================================================================

# Server Port - Render injects $PORT env var
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.qvfzamhcjefearagbera}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Dustinho271005!}
# Supabase Auth Configuration
supabase.jwt.secret=${SUPABASE_JWT_SECRET:mpRyH9VlkSSjrdTb56m5Z5mv4yO5p67okVrK7f97cO3nSoj9PCt6wk6ttau2blNBfivGbR+mKIfD9EQUMR/vYw==}

# Connection Pool - reduce for low-memory (Render free tier 512MB)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate Configurations (no explicit dialect needed for Spring Boot 3+)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson / JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
