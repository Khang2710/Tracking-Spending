# ===================================================================
# Spring Boot Configuration for PostgreSQL Database (Cloud & Local)
# ===================================================================

# Server Port
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.qvfzamhcjefearagbera}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Dustinho271005!}

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson / JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
