# Render Blueprint specification for Spending Tracker Backend
services:
  - type: web
    name: spending-tracker-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # or oregon / frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: OPENAI_KEY
        sync: false # Set securely in Render Dashboard (gsk_... or sk-...)
      - key: GEMINI_API_KEY
        sync: false
